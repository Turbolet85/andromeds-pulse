[[pattern]]
id = "app-life"
regex = '0\.57 s|1\.40 s'

[[pattern]]
id = "three-invoc"
regex = 'three invocations|all three verbs'

[[pattern]]
id = "step-order"
regex = 'boot`? ?(→|->) ?`?status'

[[pattern]]
id = "ready-on-status"
regex = 'verdict alone|until it reports `running-healthy`|until `running-healthy`'

[[pattern]]
id = "handshake-gap"
