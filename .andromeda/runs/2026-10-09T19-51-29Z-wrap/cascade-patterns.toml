[[pattern]]
id = "no-adapter-ci"
fixed = 'no adapter record in this log'

[[pattern]]
id = "dev-null"
fixed = '/dev/null'

[[pattern]]
id = "boot-poll"
regex = 'boot poll|readiness poll'

[[pattern]]
id = "p129-owner"
