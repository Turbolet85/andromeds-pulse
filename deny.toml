[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# All ignored advisories below are unmaintained-warnings on transitive deps with
# "No safe upgrade is available!" — i.e. no actionable fix at the source. Reviewed
# 2026-05-20; revisit when Tauri 2 migrates to GTK4 (closes 10 GTK3 IDs) OR when
# tauri-utils swaps urlpattern → icu_properties (closes 5 unic-* IDs) OR when
# rmcp / specta migrate off proc-macro-error / paste / older transitive chain.
# The lru 0.12.5 UNSOUND advisory (RUSTSEC-2026-0002) is NOT in this list — it
# was fixed at the source via `lru = "0.16"` workspace dep bump (2026-05-20).
ignore = [
    # Tauri 2.11 GTK3 Linux UI stack (10 IDs) — transitive via tray-icon /
    # libappindicator / wry / webkit2gtk → gtk 0.18.2 on Linux only. Upstream
    # archived; gtk4-rs is the migration target but Tauri 2 LTS has not moved.
    # Closes when Tauri ships GTK4-based tray + window backends.
    "RUSTSEC-2024-0411",  # gdkwayland-sys 0.18.2
    "RUSTSEC-2024-0412",  # gdk 0.18.2
    "RUSTSEC-2024-0413",  # atk 0.18.2
    "RUSTSEC-2024-0414",  # gdkx11-sys 0.18.2
    "RUSTSEC-2024-0415",  # gtk 0.18.2
    "RUSTSEC-2024-0416",  # atk-sys 0.18.2
    "RUSTSEC-2024-0417",  # gdkx11 0.18.2
    "RUSTSEC-2024-0418",  # gdk-sys 0.18.2
    "RUSTSEC-2024-0419",  # gtk3-macros 0.18.2
    "RUSTSEC-2024-0420",  # gtk-sys 0.18.2
    # rust-unic Unicode crates (5 IDs) — transitive via tauri-utils →
    # urlpattern 0.3 → unic-ucd-ident 0.9. Upstream open-i18n/rust-unic archived;
    # icu_properties / unicode-ident are the migration targets but urlpattern has
    # not moved. Closes when tauri-utils replaces its urlpattern dep chain.
    "RUSTSEC-2025-0075",  # unic-char-range 0.9.0
    "RUSTSEC-2025-0080",  # unic-common 0.9.0
    "RUSTSEC-2025-0081",  # unic-char-property 0.9.0
    "RUSTSEC-2025-0098",  # unic-ucd-version 0.9.0
    "RUSTSEC-2025-0100",  # unic-ucd-ident 0.9.0
    # proc-macro-error 1.0.4 unmaintained — transitive via glib-macros 0.18.5
    # (GTK3 stack closes this) + rmcp 0.6 + specta 2.0.0-rc.22. Crate maintainer
    # unreachable; proc-macro-error2 is the suggested replacement but no upstream
    # has migrated. Closes when rmcp 0.7+ + specta 2 stable + GTK4 land.
    "RUSTSEC-2024-0370",
    # paste 1.0.15 unmaintained — transitive via rmcp 0.6 + specta 2.0.0-rc.22.
    # Crate creator archived repository; pastey is the drop-in replacement.
    # Closes when rmcp + specta migrate off paste.
    "RUSTSEC-2024-0436",
    # bincode 1.3.3 unmaintained — direct dep in buffer + triage + pulse-app
    # for serialized state persistence (Drain templates / baseline / lifecycle /
    # storm snapshots). Bincode team ceased development after doxxing incident;
    # 1.3.3 is the final stable version per upstream. pulse-app::bincode_bounded
    # wraps it with size-limit options + baseline_persistence prefix validator
    # provides type-specific OOM protection at untrusted-input boundaries (per
    # session-learning 2026-05-20). Future migration to bincode 2.x (try_reserve-
    # based safer allocations) tracked as separate follow-up. Closes when the
    # bincode 2.x migration lands.
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    # Community Data License Agreement Permissive 2.0 — permissive, MIT-compatible.
    # Pulled in transitively via webpki-root-certs (Mozilla CA bundle) → rustls-platform-verifier → reqwest → tauri (route#6, 2026-05-03).
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 — OSI-approved, MIT-compatible permissive.
    # Pulled in transitively via clipboard-win + error-code → tauri-plugin-clipboard-manager 2 (chunk #43, 2026-05-11).
    "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "warn"
highlight = "all"
allow = []
deny = [
    # canary: catch tonic <0.14 transitive duplicate (the OTLP-receiver
    # ↔ opentelemetry-otlp 0.31 (pinned tonic 0.13) mismatch flagged in
    # arch §Established Decisions [Backend Framework — OTLP receiver]
    # caveat + §Inherited Defaults open-question). When ingest body
    # lands (route#16+), this entry surfaces the duplicate as a build
    # failure per security plan §Dependency Security Pinning.
    { name = "tonic", version = "<0.14" },
]
# Known-benign duplicates from the Tauri 2.11 ecosystem dep tree.
# Reviewed at chunk #2 scaffold; not in scope for tightening here.
# The tonic 0.14 ↔ opentelemetry-otlp 0.31 (tonic 0.13) duplicate is
# explicitly NOT in this list — when ingest body lands (route#16+), the
# `bans` check catches it per security plan §Dependency Security.
skip = [
    { crate = "base64" },
    { crate = "bitflags" },
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "heck" },
    { crate = "indexmap" },
    { crate = "phf" },
    { crate = "phf_generator" },
    { crate = "phf_macros" },
    { crate = "phf_shared" },
    { crate = "png" },
    { crate = "proc-macro-crate" },
    { crate = "r-efi" },
    { crate = "serde_spanned" },
    { crate = "syn" },
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "toml" },
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "windows-link" },
    { crate = "windows-sys" },
    { crate = "windows-targets" },
    { crate = "windows_aarch64_gnullvm" },
    { crate = "windows_aarch64_msvc" },
    { crate = "windows_i686_gnu" },
    { crate = "windows_i686_gnullvm" },   # added route#3: tauri-plugin-updater 2.10 transitive
    { crate = "windows_i686_msvc" },
    { crate = "windows_x86_64_gnu" },
    { crate = "windows_x86_64_gnullvm" },
    { crate = "windows_x86_64_msvc" },
    { crate = "winnow" },
    { crate = "wit-bindgen" },
    # tauri-plugin-updater 2.10 transitive deps (route#3, 2026-05-03)
    { crate = "jni" },
    { crate = "jni-sys" },
    { crate = "redox_syscall" },
    # taurpc 0.7 + specta 2.0.0-rc.22 transitive deps (route#4, 2026-05-03)
    { crate = "ctor" },
    { crate = "windows-core" },
    { crate = "windows-result" },
    { crate = "windows-strings" },
    # tonic-prost-build 0.14 build-dep stack pulls foldhash 0.1 via hashbrown / petgraph;
    # tauri-utils / dom_query pull foldhash 0.2. Both transitive, both build-time only,
    # benign per route#16 (2026-05-04).
    { crate = "foldhash" },
    # tower_governor 0.8 transitive deps via governor 0.10 + axum-test (route#19, 2026-05-05)
    { crate = "rand" },
    { crate = "rand_core" },
    # duckdb 1.10502 / libduckdb-sys 1.10502 bundled C++ build pulls zip 6 via libduckdb-sys
    # build script; tauri-plugin-updater 2.10 keeps zip 4 for archive extraction (route#20, 2026-05-06)
    { crate = "zip" },
    # libduckdb-sys 1.10502 build script transitively pulls a newer reqwest / rustix /
    # linux-raw-sys; tauri-plugin-updater 2.10 + axum-test 18 keep older versions of the
    # same crates in the runtime graph. Build-time vs runtime split, not a real conflict
    # (route#20, 2026-05-06).
    { crate = "linux-raw-sys" },
    { crate = "reqwest" },
    { crate = "rustix" },
    # tauri-plugin-notification 2 transitive (notify-rust 4 → zbus_names 4) pulls
    # quick-xml 0.39 alongside tauri's existing 0.37 (chunk #43, 2026-05-11).
    { crate = "quick-xml" },
    # wasmtime 43+ + wat 1 transitive build/runtime deps (chunk #45, 2026-05-11):
    # redox_users (tempfile's transitive variant vs. Tauri's tracing/zbus chain);
    # wasm-encoder (wasmtime 43 internal vs. wat 1.248 lifter);
    # fixedbitset (cranelift-codegen 0.130 vs. older variants pulled by other crates);
    # petgraph (cranelift-codegen 0.130 vs. wasm-compose / wit-parser);
    # target-lexicon (wasmtime 43 internal vs. tauri-utils older variant).
    { crate = "redox_users" },
    { crate = "wasm-encoder" },
    { crate = "fixedbitset" },
    { crate = "petgraph" },
    { crate = "target-lexicon" },
    # rmcp 0.6.4 transitive deps under --features mcp-server (chunk #48, 2026-05-12):
    # rmcp-macros pulls darling 0.21.x; tauri-utils/serde_with pulls darling 0.23.x.
    # Both ecosystems are stable; bumping rmcp to 0.7+ (when published) may close
    # the darling gap. schemars 1.x duplicate similarly stems from rmcp 0.6 vs the
    # tauri-utils transitive chain. Build-time only via proc-macro crates; no
    # runtime impact.
    { crate = "darling" },
    { crate = "darling_core" },
    { crate = "darling_macro" },
    { crate = "schemars" },
    { crate = "schemars_derive" },
    # blake3 1.8.5 transitive dep under chunk #66 (2026-05-17): pulls cpufeatures
    # 0.3.x for SIMD detection; sha2 0.10 (existing transitive via tauri-codegen +
    # wasmtime + wry) keeps cpufeatures 0.2.x. Pure ABI bump in the cpufeatures
    # crate (same maintainer); both versions are build/runtime fine. Tightening
    # would require either downgrading blake3 (worse hashing perf) OR waiting for
    # tauri-codegen to bump to cpufeatures 0.3 (out of our control).
    { crate = "cpufeatures" },
    # corpus crate (chunk #68, 2026-05-18) adds rusqlite 0.32 (bundled SQLite for
    # the persistent incident corpus). rusqlite 0.32 transitively pulls hashlink
    # 0.9.1 + rand 0.8.6 → rand_chacha 0.3.1; duckdb 1.10502 (pre-existing buffer
    # ring-buffer dep) carries hashlink 0.10.0; proptest 1.11 + governor 0.10 +
    # tauri-plugin-notification 2.3 carry rand 0.9.4 → rand_chacha 0.9.0. Build/
    # runtime fine in both versions — the duplicate is purely the rusqlite ↔
    # duckdb / rand-0.8 ↔ rand-0.9 split of the same crate name. Tightening
    # would require either bumping rusqlite to 0.33 (hashlink 0.10) AND its rand
    # transitive (semver-major; touches AEAD nonce generation in corpus encrypt
    # path) OR waiting for duckdb to downgrade hashlink — neither is in scope
    # for chunk-level hygiene. Pattern mirrors rand + rand_core (route#19) and
    # follows the 2026-05-03 session-learning (Tauri-ecosystem-bump-style skip
    # entries with provenance).
    { crate = "hashlink" },
    { crate = "rand_chacha" },
    # tokenizers 0.21 + ureq 2.x transitive duplicates (chunk #81, 2026-05-23):
    # - `nom`: tokenizers 0.21 → spm_precompiled 0.1.4 pulls nom 7.x;
    #   tauri-utils + other transitive crates pull nom 8.x. Build/runtime fine;
    #   tightening would require waiting for tokenizers to bump spm_precompiled
    #   to the nom 8.x line.
    # - `webpki-roots`: ureq 2.12 (triage build-dep for tokenizer fixture
    #   download per build.rs Phase 2) pulls webpki-roots 0.26; reqwest 0.13
    #   (transitive via tauri / tauri-plugin-updater) pulls webpki-roots 1.x.
    #   Build vs runtime split (ureq is build-only — the tokenizer.json
    #   download happens once at compile time); reqwest is the runtime HTTPS
    #   client for the Tauri updater. Tightening would require either
    #   downgrading reqwest (loss of tls upgrades) OR waiting for ureq 3.x
    #   to bump to webpki-roots 1.x.
    { crate = "nom" },
    { crate = "webpki-roots" },
]
skip-tree = []

