[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# All ignored advisories below are unmaintained-warnings on transitive deps with
# "No safe upgrade is available!" — i.e. no actionable fix at the source. Reviewed
# 2026-05-20; holders re-derived 2026-08-29-advisory-backlog and
# 2026-11-03-advisories-since-2026-10-12-closed. Revisit when Tauri 2 migrates to
# GTK4 (frees proc-macro-error) OR when tokenizers / specta migrate off paste OR
# when the zbus 4 / 5 holders reach a maintained zvariant line.
# The lru 0.12.5 UNSOUND advisory (RUSTSEC-2026-0002) is NOT in this list — it
# was fixed at the source via `lru = "0.16"` workspace dep bump (2026-05-20).
ignore = [
    # The ten GTK3 ignores (RUSTSEC-2024-0411 ... -0420, gtk / gdk / atk 0.18.2
    # family) were REMOVED at 2026-11-03-advisories-since-2026-10-12-closed: the
    # advisory database withdrew all ten on 2026-08-14, so they ignored nothing
    # and cargo-deny flagged them advisory-not-detected. The five rust-unic
    # ignores (RUSTSEC-2025-0075 / -0080 / -0081 / -0098 / -0100) were removed at
    # the same chunk: their closing condition fired — tauri-utils 2.10 moved to
    # urlpattern 0.6 and every unic-* crate left the lockfile. A stale ignore
    # would hide a re-filed advisory.
    #
    # zbus_names / zvariant / zvariant_derive unmaintained (3 IDs; no stated
    # solution in any of the three advisories). Held at two versions each:
    # zbus 4.4.0 <- secret-service 4.0.0 <- keyring's `sync-secret-service`
    # feature (the corpus key's Linux backend, which must not be dropped — it
    # would leave a per-process corpus key) and zbus 5.15.0 <- notify-rust
    # 4.17.0 <- tauri-plugin-notification. No zbus 4.x / 5.x release clears
    # them. Owner: 2026-11-03-advisories-since-2026-10-12-closed (the founder's
    # word, 2026-11-03). Closes when a maintained replacement reaches those
    # holders, or the holders leave the graph.
    "RUSTSEC-2026-0370",  # zvariant
    "RUSTSEC-2026-0371",  # zbus_names
    "RUSTSEC-2026-0372",  # zvariant_derive
    # proc-macro-error 1.0.4 unmaintained — transitive via glib-macros 0.18.5 +
    # gtk3-macros 0.18.2 (GTK3 stack ONLY: the rmcp 3 bump at
    # 2026-08-29-advisory-backlog re-derived the holders and rmcp / specta no
    # longer pull it). Crate maintainer unreachable; proc-macro-error2 is the
    # suggested replacement but the GTK3 stack has not migrated. Closes when
    # Tauri ships GTK4 backends.
    "RUSTSEC-2024-0370",
    # paste 1.0.15 unmaintained — transitive via tokenizers 0.21
    # (macro_rules_attribute) + specta 2.0.0-rc.22 (holders re-derived at
    # 2026-08-29-advisory-backlog: rmcp 3 no longer pulls it). Crate creator
    # archived repository; pastey is the drop-in replacement. Closes when
    # tokenizers + specta migrate off paste.
    "RUSTSEC-2024-0436",
    # The im-rc cluster ignores (RUSTSEC-2026-0247/0250/0251, bitmaps/im-rc/
    # sized-chunks) were REMOVED at 2026-08-29-advisory-backlog: their stated
    # closing condition fired — wasmtime 46 dropped the im-rc chain, all three
    # crates left the lockfile, and cargo-deny flagged the entries
    # advisory-not-detected. A stale ignore would hide the advisory's return.
    #
    # The owned upgradeable set (8 ids: RUSTSEC-2026-0189/0190/0194/0195/0204/
    # 0222/0253/0258) was CLOSED at 2026-08-29-advisory-backlog — every finding
    # upgraded at the source (rmcp 3 · wasmtime 46 · quick-xml 0.41 single-version ·
    # crossbeam-epoch 0.9.20 · anyhow 1.0.104 · lru 0.18 · h2 0.4.19), none
    # ignore-listed. The standing posture is unchanged: a finding WITH a stated
    # safe upgrade is NEVER added to this list — it gets a named owner and stays
    # RED until upgraded; only no-safe-upgrade findings are ignore-eligible.
    #
    # bincode 1.3.3 unmaintained — direct dep in buffer + triage + pulse-app
    # for serialized state persistence (Drain templates / baseline / lifecycle /
    # storm snapshots). Bincode team ceased development after doxxing incident;
    # 1.3.3 is the final stable version per upstream. pulse-app::bincode_bounded
    # wraps it with size-limit options + baseline_persistence prefix validator
    # provides type-specific OOM protection at untrusted-input boundaries (per
    # session-learning 2026-05-20). Future migration to bincode 2.x (try_reserve-
    # based safer allocations) tracked as separate follow-up. Closes when the
    # bincode 2.x migration lands.
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    # Community Data License Agreement Permissive 2.0 — permissive, MIT-compatible.
    # Pulled in transitively via webpki-root-certs (Mozilla CA bundle) → rustls-platform-verifier → reqwest → tauri (route#6, 2026-05-03).
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 — OSI-approved, MIT-compatible permissive.
    # Pulled in transitively via clipboard-win + error-code → tauri-plugin-clipboard-manager 2 (chunk #43, 2026-05-11).
    "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "warn"
highlight = "all"
allow = []
deny = [
    # canary: catch tonic <0.14 transitive duplicate (the OTLP-receiver
    # ↔ opentelemetry-otlp 0.31 (pinned tonic 0.13) mismatch flagged in
    # arch §Established Decisions [Backend Framework — OTLP receiver]
    # caveat + §Inherited Defaults open-question). When ingest body
    # lands (route#16+), this entry surfaces the duplicate as a build
    # failure per security plan §Dependency Security Pinning.
    { name = "tonic", version = "<0.14" },
]
# Known-benign duplicates from the Tauri 2.11 ecosystem dep tree.
# Reviewed at chunk #2 scaffold; not in scope for tightening here.
# The tonic 0.14 ↔ opentelemetry-otlp 0.31 (tonic 0.13) duplicate is
# explicitly NOT in this list — when ingest body lands (route#16+), the
# `bans` check catches it per security plan §Dependency Security.
skip = [
    { crate = "base64" },
    { crate = "bitflags" },
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "heck" },
    { crate = "indexmap" },
    { crate = "proc-macro-crate" },
    { crate = "r-efi" },
    { crate = "serde_spanned" },
    { crate = "syn" },
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "toml" },
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "windows-sys" },
    { crate = "windows-targets" },
    { crate = "windows_aarch64_gnullvm" },
    { crate = "windows_aarch64_msvc" },
    { crate = "windows_i686_gnu" },
    { crate = "windows_i686_gnullvm" },   # added route#3: tauri-plugin-updater 2.10 transitive
    { crate = "windows_i686_msvc" },
    { crate = "windows_x86_64_gnu" },
    { crate = "windows_x86_64_gnullvm" },
    { crate = "windows_x86_64_msvc" },
    { crate = "winnow" },
    { crate = "wit-bindgen" },
    # tauri-plugin-updater 2.10 transitive deps (route#3, 2026-05-03)
    { crate = "jni" },
    { crate = "jni-sys" },
    { crate = "redox_syscall" },
    # taurpc 0.7 + specta 2.0.0-rc.22 transitive deps (route#4, 2026-05-03).
    # windows-core / windows-result / windows-strings were skipped here until
    # 2026-08-29: the duckdb 1.10502 -> 1.10505 bump dropped the second copy of
    # each, so cargo-deny flags the entries as unnecessary-skip. Removed rather
    # than kept — a stale skip hides the duplicate's return.
    { crate = "ctor" },
    # duckdb 1.10505's libduckdb-sys build script pulls ureq 3.4.0 while
    # crates/triage's own build.rs (tokenizer fetch) pulls ureq 2.12.1. BOTH are
    # [build-dependencies] only — neither links into any shipped binary, so the
    # duplicate costs build time and nothing else. Not source-fixable without
    # migrating triage/build.rs to the ureq 3 API, which is a breaking rewrite of
    # a downloader that already carries its own cap-hit hard-error discipline.
    # Closes when triage/build.rs moves to ureq 3 or stops needing an HTTP client
    # (chunk 2026-08-28-duplicate-span-replay-fails-loudly, 2026-08-29).
    { crate = "ureq" },
    # tonic-prost-build 0.14 build-dep stack pulls foldhash 0.1 via hashbrown / petgraph;
    # tauri-utils / dom_query pull foldhash 0.2. Both transitive, both build-time only,
    # benign per route#16 (2026-05-04).
    { crate = "foldhash" },
    # tower_governor 0.8 transitive deps via governor 0.10 + axum-test (route#19, 2026-05-05)
    { crate = "rand" },
    { crate = "rand_core" },
    # keyring 3.6.3 platform-backend features (2026-08-15-corpus-key-persistence).
    # Owner: the corpus key-custody path (`crates/corpus/src/keychain.rs`).
    # keyring itself depends on BOTH security-framework 2.11 and 3.7 — the
    # duplicate is INTERNAL to that one crate, not a conflict between keyring
    # and the rest of the tree, so no version choice here can resolve it.
    # core-foundation 0.9/0.10 rides along as security-framework 2.x's own dep.
    # Both are macOS-only code paths, unreachable on Windows/Linux builds.
    # Not source-fixable: dropping `apple-native` would drop macOS key
    # persistence entirely, which is the defect this chunk exists to fix.
    # Revisit when keyring consolidates on a single security-framework major.
    { crate = "core-foundation" },
    { crate = "security-framework" },
    # The zip, phf / phf_generator / phf_macros / phf_shared and png skips were
    # REMOVED at 2026-11-03-advisories-since-2026-10-12-closed: duckdb 1.10506.1
    # and tauri-plugin-updater 2.14.1 converged on a single zip 9.3.0, Tauri 2.12
    # dropped phf 0.11 and png 0.17, and cargo-deny flagged the entries
    # unnecessary-skip. The windows 0.61 / 0.62 split Tauri 2.12 brought was
    # closed at the source in the same chunk (notify-rust 4.18.2 takes
    # tauri-winrt-notification 0.8.1 on windows 0.62), so it takes no skip, and
    # with windows 0.61 gone windows-link stands at one version: its skip was
    # removed too.
    # libduckdb-sys 1.10502 build script transitively pulls a newer reqwest / rustix /
    # linux-raw-sys; tauri-plugin-updater 2.10 + axum-test 18 keep older versions of the
    # same crates in the runtime graph. Build-time vs runtime split, not a real conflict
    # (route#20, 2026-05-06).
    { crate = "linux-raw-sys" },
    { crate = "reqwest" },
    { crate = "rustix" },
    # The quick-xml skip was REMOVED at 2026-08-29-advisory-backlog: the lockfile
    # converged on a single quick-xml 0.41.0 (tauri-winrt-notification 0.7.3
    # dropped its copy; plist 1.10 + wayland-scanner 0.31.11 both require ^0.41),
    # and cargo-deny flagged the entry unnecessary-skip.
    # wasmtime 46+ + wat 1 transitive build/runtime deps (chunk #45 origin;
    # re-verified at 2026-08-29-advisory-backlog under wasmtime 46.0.3 — all five
    # still multi-version):
    # redox_users (tempfile's transitive variant vs. Tauri's tracing/zbus chain);
    # wasm-encoder (wasmtime 46 internal vs. wat 1.258 lifter);
    # fixedbitset (cranelift-codegen vs. older variants pulled by other crates);
    # petgraph (cranelift-codegen vs. wasm-compose / wit-parser);
    # target-lexicon (wasmtime 46 internal vs. tauri-utils older variant).
    { crate = "redox_users" },
    { crate = "wasm-encoder" },
    { crate = "fixedbitset" },
    { crate = "petgraph" },
    { crate = "target-lexicon" },
    # darling splits across two proc-macro holders (chunk #48 origin; rmcp, the
    # third holder, left the graph with the stdio sidecar): serde_with pulls
    # 0.23.x, derive_builder pulls 0.20.x. Build-time only via proc-macro
    # crates; no runtime impact. Closes if the holders converge on one darling
    # major.
    { crate = "darling" },
    { crate = "darling_core" },
    { crate = "darling_macro" },
    # blake3 1.8.5 transitive dep under chunk #66 (2026-05-17): pulls cpufeatures
    # 0.3.x for SIMD detection; sha2 0.10 (existing transitive via tauri-codegen +
    # wasmtime + wry) keeps cpufeatures 0.2.x. Pure ABI bump in the cpufeatures
    # crate (same maintainer); both versions are build/runtime fine. Tightening
    # would require either downgrading blake3 (worse hashing perf) OR waiting for
    # tauri-codegen to bump to cpufeatures 0.3 (out of our control).
    { crate = "cpufeatures" },
    # corpus crate (chunk #68, 2026-05-18) adds rusqlite 0.32 (bundled SQLite for
    # the persistent incident corpus). rusqlite 0.32 transitively pulls hashlink
    # 0.9.1 + rand 0.8.6 → rand_chacha 0.3.1; duckdb 1.10502 (pre-existing buffer
    # ring-buffer dep) carries hashlink 0.10.0; proptest 1.11 + governor 0.10 +
    # tauri-plugin-notification 2.3 carry rand 0.9.4 → rand_chacha 0.9.0. Build/
    # runtime fine in both versions — the duplicate is purely the rusqlite ↔
    # duckdb / rand-0.8 ↔ rand-0.9 split of the same crate name. Tightening
    # would require either bumping rusqlite to 0.33 (hashlink 0.10) AND its rand
    # transitive (semver-major; touches AEAD nonce generation in corpus encrypt
    # path) OR waiting for duckdb to downgrade hashlink — neither is in scope
    # for chunk-level hygiene. Pattern mirrors rand + rand_core (route#19) and
    # follows the 2026-05-03 session-learning (Tauri-ecosystem-bump-style skip
    # entries with provenance).
    { crate = "hashlink" },
    { crate = "rand_chacha" },
    # tokenizers 0.21 + ureq 2.x transitive duplicates (chunk #81, 2026-05-23):
    # - `nom`: tokenizers 0.21 → spm_precompiled 0.1.4 pulls nom 7.x;
    #   tauri-utils + other transitive crates pull nom 8.x. Build/runtime fine;
    #   tightening would require waiting for tokenizers to bump spm_precompiled
    #   to the nom 8.x line.
    # - `webpki-roots`: ureq 2.12 (triage build-dep for tokenizer fixture
    #   download per build.rs Phase 2) pulls webpki-roots 0.26; reqwest 0.13
    #   (transitive via tauri / tauri-plugin-updater) pulls webpki-roots 1.x.
    #   Build vs runtime split (ureq is build-only — the tokenizer.json
    #   download happens once at compile time); reqwest is the runtime HTTPS
    #   client for the Tauri updater. Tightening would require either
    #   downgrading reqwest (loss of tls upgrades) OR waiting for ureq 3.x
    #   to bump to webpki-roots 1.x.
    { crate = "nom" },
    { crate = "webpki-roots" },
]
skip-tree = []

