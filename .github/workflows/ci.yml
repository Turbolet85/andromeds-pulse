name: ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

env:
  SERVICE_NAME: com.andromeda.pulse
  DEPLOYMENT_ENVIRONMENT: production
  CI_RUN_ID: ${{ github.run_id }}
  GIT_COMMIT_SHA: ${{ github.sha }}
  CARGO_TERM_COLOR: always

# Independent jobs: a round lasts as long as its longest job, not the sum.
# Cache keys are budgeted against the 10 GB repository cap: one target cache for
# lint-test and one for boot; a11y, mcp-test and supply-chain restore read-only,
# and coverage keeps only the registry.
jobs:
  lint-test:
    name: lint / test (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: lint-test-${{ runner.os }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: cargo-nextest

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo fmt --check
        run: cargo fmt --check

      # Source files are English-only. Russian prepositions and Cyrillic homoglyphs
      # (U+043A for "to", U+0430 for "a", U+0431 for "b") had leaked into comments,
      # error strings and - critically - the L4 system prompts, degrading what the
      # local model receives. The scan is an xtask verb so pre-push:linux runs the
      # same check. Docs, rules and .andromeda/ are OUT of scope - they
      # legitimately quote the operator in Russian.
      - name: No Cyrillic in sources
        run: cargo xtask check:english-sources

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo xtask typecheck (tsc --noEmit against TauRPC bindings)
        run: cargo xtask typecheck

      - name: cargo xtask quarantine-tracking (chunk #55 — #[ignore] tests must carry GitHub issue URL)
        run: cargo xtask quarantine-tracking

      - name: cargo xtask capability-drift (TauRPC procedures vs arch §Occupied Resources)
        run: cargo xtask capability-drift

      - name: cargo xtask check:staged-artifacts (staged bindings + capability grants vs pins)
        run: cargo xtask check:staged-artifacts

      - name: cargo xtask capability-widening-check (chunk #77 — NEVER-widen bans on pulse:notification/tray/plugin-fs)
        run: cargo xtask capability-widening-check

      - name: cargo xtask verify:capability-matrix (reads the capability record — P-001..P-082, each claimed or retired)
        run: cargo xtask verify:capability-matrix

      # Runs after the drift checks: the default-features test run rewrites
      # pulse-app/ui/src/bindings/index.ts without the feature-gated mcp
      # namespace, which capability-drift would then read as drift.
      - name: cargo xtask test
        run: cargo xtask test

      # Selects its one test under --workspace, so it reuses the test build above.
      - name: cargo xtask perf:slo-load (10k spans/sec sustained-load)
        run: cargo xtask perf:slo-load

      # The in-process producer of the memory + snapshot perf samples (no
      # window), then the budget gate over its log with both arms required.
      - name: cargo nextest run --workspace --profile perf-samples
        run: cargo nextest run --workspace --profile perf-samples --no-tests=fail

      - name: cargo xtask perf:budget (memory + snapshot required)
        run: cargo xtask perf:budget --data-dir target/tmp/perf-budget-samples --require memory,snapshot

      - name: Upload perf-samples logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-perf-samples-${{ runner.os }}
          path: target/tmp/perf-budget-samples/logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload capability-drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-drift-${{ runner.os }}
          path: target/capability-drift/report.json
          if-no-files-found: error
          retention-days: 14

  mcp-test:
    name: mcp-server tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # The default-features test build's dependencies; only the feature-gated
      # workspace crates compile here.
      - name: Cache cargo (restore only)
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: lint-test-${{ runner.os }}
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: cargo-nextest

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo nextest run --features mcp-server
        run: cargo nextest run --workspace --features mcp-server --profile ci --no-tests=fail

  a11y:
    name: a11y (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Only the xtask binary is compiled here; lint-test owns the key.
      - name: Cache cargo (restore only)
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: lint-test-${{ runner.os }}
          save-if: false

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build --prefix pulse-app/ui (Vite dist for a11y harness)
        working-directory: pulse-app/ui
        run: npm run build

      # A fresh runner has no Playwright browser build for the pinned
      # @playwright/test; the axe/contrast suites launch chromium.
      - name: Install Playwright chromium (a11y harness)
        working-directory: pulse-app/ui
        run: npx playwright install --with-deps chromium

      - name: cargo xtask test:a11y (axe + Lighthouse + pa11y + colorjs.io + aggregator + regression)
        run: cargo xtask test:a11y

      - name: Upload a11y violations summary + regression set + contrast report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-violations-${{ runner.os }}
          path: |
            ${{ env.ANDROMEDA_PULSE_DATA_DIR }}/logs/a11y-*.json*
            pulse-app/ui/dist/contrast-report.json
            pulse-app/ui/tests-a11y/regression-set.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright a11y report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-a11y-report-${{ runner.os }}
          path: target/playwright-a11y-report/
          if-no-files-found: error
          retention-days: 14

  boot:
    name: boot smoke (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: boot-Linux
          cache-on-failure: true

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo build --features mcp-server (feature-gated binary build smoke)
        run: cargo build --workspace --release --features mcp-server

      # scripts/exit-witness.c records the call that ends the app process,
      # with its caller. The boot verb loads the built library onto the app
      # alone, on its one spawn line; here it is only built and named.
      - name: Build the exit witness
        run: |
          cc -shared -fPIC -O2 -o "$RUNNER_TEMP/exit-witness.so" scripts/exit-witness.c
          echo "ANDROMEDA_PULSE_EXIT_WITNESS_LIB=$RUNNER_TEMP/exit-witness.so" >> "$GITHUB_ENV"

      - name: Boot pulse-app smoke
        # The runner is headless: without a display tao panics initialising
        # GTK. One xvfb-run spans the whole sequence so the X server outlives
        # boot's backgrounded app, and -e keeps the X server's own error
        # output in the uploaded logs. harness:settled reads the app once it
        # has settled, or at its end, and says what it saw; cleanup runs
        # whatever harness:settled and status returned.
        run: |
          mkdir -p "$ANDROMEDA_PULSE_DATA_DIR/logs"
          xvfb-run -a -e "$ANDROMEDA_PULSE_DATA_DIR/logs/xvfb.log" --server-args="-screen 0 1280x1024x24" bash -c '
            bash scripts/agent-run.sh boot || exit 1
            cargo xtask harness:settled; a=$?
            bash scripts/agent-run.sh status; b=$?
            bash scripts/agent-run.sh cleanup; c=$?
            test "$a$b$c" = 000
          '

      # Seven more boots of the same build, so one run reads eight. Each has
      # its own data dir, display server and per-user data and cache dirs,
      # and is recorded with its ordinal in logs/boot-series.json. A boot
      # that ends by itself fails the step; it runs when the smoke is red too.
      - name: Boot series (equal source)
        if: always()
        run: cargo xtask harness:boot-series --count 7

      # Reads the log the boot smoke above wrote under ANDROMEDA_PULSE_DATA_DIR.
      - name: cargo xtask ci-gates
        run: cargo xtask ci-gates

      # One cycle of the harness verbs on the console engine, on a data dir
      # and ports of its own: boot engine, a healthy feed over OTLP, the
      # settle read, status engine, cleanup, then the check over the engine's
      # own log (panic, heartbeat gap, progress, process end, memory budget).
      # It runs whatever the steps before it returned.
      - name: Console engine cycle
        if: always()
        run: cargo xtask harness:engine-cycle --data-dir "$RUNNER_TEMP/andromeda-pulse-engine-data"

      - name: Upload boot logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-boot-${{ runner.os }}
          path: ${{ env.ANDROMEDA_PULSE_DATA_DIR }}/logs/
          if-no-files-found: error
          retention-days: 14

      # The console engine's own log family, as the cycle above left it.
      - name: Upload engine logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-engine-${{ runner.os }}
          path: ${{ runner.temp }}/andromeda-pulse-engine-data/logs/
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: supply-chain (audit + deny + auditable)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # The release dependency graph largely coincides with boot's; boot owns the key.
      - name: Cache cargo (restore only)
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: boot-Linux
          save-if: false

      - name: cargo audit (RustSec advisory DB)
        run: cargo audit

      - name: cargo deny check bans licenses sources
        uses: EmbarkStudios/cargo-deny-action@a4d2d701318fdc1c6ae17ba8cea8f329c5110eb2 # v2.0.17
        with:
          command: check bans licenses sources

      - name: Cranelift-only WASM backend assertion (test-plan §9)
        run: cargo tree -p wasmtime | grep -q "cranelift" || exit 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      # npm advisory + license + ban gate over pulse-app/ui. No npm ci needed:
      # license/class data comes from package-lock.json and `npm audit` reads
      # the lockfile + registry, never node_modules.
      - name: cargo xtask check:npm-supply-chain (npm advisory + license + ban gate)
        run: cargo xtask check:npm-supply-chain

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: Install cargo-auditable
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: cargo-auditable

      # Also the Linux workspace release build smoke.
      - name: cargo auditable build smoke (workspace release)
        run: cargo auditable build --workspace --release

  coverage:
    name: coverage gate (line ≥75% / function ≥85%)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Registry only: an instrumented target cache would not fit the repo cap.
      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: coverage
          cache-targets: false
          cache-on-failure: true

      - name: Install cargo-nextest + cargo-llvm-cov
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: cargo-nextest,cargo-llvm-cov

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo xtask test:coverage
        run: cargo xtask test:coverage

      - name: Enforce coverage thresholds
        run: |
          set -euo pipefail
          if [ ! -f lcov.info ]; then
            echo "::error::lcov.info missing — coverage gate cannot evaluate"
            exit 1
          fi
          line_total=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' lcov.info)
          line_hit=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' lcov.info)
          fn_total=$(awk -F: '/^FNF:/{s+=$2} END{print s+0}' lcov.info)
          fn_hit=$(awk -F: '/^FNH:/{s+=$2} END{print s+0}' lcov.info)
          if [ "$line_total" -eq 0 ] || [ "$fn_total" -eq 0 ]; then
            echo "::error::lcov.info tracks ${line_total} lines and ${fn_total} functions — coverage gate cannot pass a report that tracks nothing"
            exit 1
          fi
          line_pct=$(awk -v h="$line_hit" -v t="$line_total" 'BEGIN { printf "%.1f", (h/t)*100 }')
          fn_pct=$(awk -v h="$fn_hit" -v t="$fn_total" 'BEGIN { printf "%.1f", (h/t)*100 }')
          echo "Line:     ${line_hit}/${line_total} = ${line_pct}% (threshold 75%)"
          echo "Function: ${fn_hit}/${fn_total} = ${fn_pct}% (threshold 85%)"
          fail=0
          awk -v pct="$line_pct"   'BEGIN { exit (pct + 0 < 75.0) }' || { echo "::error::line coverage ${line_pct}% < 75%"; fail=1; }
          awk -v pct="$fn_pct"     'BEGIN { exit (pct + 0 < 85.0) }' || { echo "::error::function coverage ${fn_pct}% < 85%"; fail=1; }
          [ $fail -eq 0 ]

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-linux
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
