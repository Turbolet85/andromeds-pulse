name: ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

env:
  SERVICE_NAME: com.andromeda.pulse
  DEPLOYMENT_ENVIRONMENT: production
  CI_RUN_ID: ${{ github.run_id }}
  GIT_COMMIT_SHA: ${{ github.sha }}
  CARGO_TERM_COLOR: always

# Independent jobs: a round lasts as long as its longest job, not the sum.
# Cache keys are budgeted against the 10 GB repository cap: one target cache per
# lint-test OS, one per release OS (macOS, Windows) and one for boot; a11y,
# mcp-test and supply-chain restore read-only, and coverage keeps only the registry.
jobs:
  lint-test:
    name: lint / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: lint-test-${{ runner.os }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: cargo-nextest

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo fmt --check
        run: cargo fmt --check

      # Source files are English-only. Russian prepositions and Cyrillic homoglyphs
      # (U+043A for "to", U+0430 for "a", U+0431 for "b") had leaked into comments,
      # error strings and - critically - the L4 system prompts, degrading what the
      # local model receives. `shell: python` is deliberate: BSD grep on the macOS
      # runner has no -P, and GNU grep -P is locale-sensitive on Windows. Docs,
      # rules and .andromeda/ are OUT of scope - they legitimately quote the
      # operator in Russian.
      - name: No Cyrillic in sources
        shell: python
        run: |
          import pathlib, re, sys
          CYRILLIC = re.compile("[%s-%s]" % (chr(0x0400), chr(0x04FF)))
          ROOTS = ["crates", "pulse-app/src", "pulse-app/tests", "pulse-app/ui/src", "xtask/src"]
          EXTS = {".rs", ".ts", ".tsx"}
          hits = []
          for root in ROOTS:
              for path in pathlib.Path(root).rglob("*"):
                  if not path.is_file() or path.suffix not in EXTS:
                      continue
                  text = path.read_text(encoding="utf-8", errors="replace")
                  for n, line in enumerate(text.splitlines(), 1):
                      if CYRILLIC.search(line):
                          hits.append(f"{path.as_posix()}:{n}: {line.strip()[:120]}")
          for h in hits:
              print(f"::error::Cyrillic character in source - {h}")
          if hits:
              print(f"{len(hits)} line(s) carry Cyrillic characters; sources are English-only.")
              sys.exit(1)
          print("no Cyrillic in source files")

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo xtask typecheck (tsc --noEmit against TauRPC bindings)
        run: cargo xtask typecheck

      - name: cargo xtask quarantine-tracking (chunk #55 — #[ignore] tests must carry GitHub issue URL)
        run: cargo xtask quarantine-tracking

      - name: cargo xtask capability-drift (TauRPC procedures vs arch §Occupied Resources)
        run: cargo xtask capability-drift

      - name: cargo xtask check:staged-artifacts (staged bindings + capability grants vs pins)
        run: cargo xtask check:staged-artifacts

      - name: cargo xtask capability-widening-check (chunk #77 — NEVER-widen bans on pulse:notification/tray/plugin-fs)
        run: cargo xtask capability-widening-check

      - name: cargo xtask verify:capability-matrix (chunk #99 — P-001..P-060 scenario mapping)
        run: cargo xtask verify:capability-matrix

      # Runs after the drift checks: the default-features test run rewrites
      # pulse-app/ui/src/bindings/index.ts without the feature-gated mcp
      # namespace, which capability-drift would then read as drift.
      - name: cargo xtask test (no-tests=pass at Foundation epoch)
        run: cargo xtask test

      # Selects its one test under --workspace, so it reuses the test build above.
      - name: cargo xtask perf:slo-load (10k spans/sec sustained-load) (Linux only)
        if: runner.os == 'Linux'
        run: cargo xtask perf:slo-load

      # The in-process producer of the memory + snapshot perf samples (no
      # window), then the budget gate over its log with both arms required.
      - name: cargo nextest run --workspace --profile perf-samples (Linux only)
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --profile perf-samples

      - name: cargo xtask perf:budget (memory + snapshot required) (Linux only)
        if: runner.os == 'Linux'
        run: cargo xtask perf:budget --data-dir target/tmp/perf-budget-samples --require memory,snapshot

      - name: Upload perf-samples logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-perf-samples-${{ runner.os }}
          path: target/tmp/perf-budget-samples/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ runner.os }}
          path: ${{ env.ANDROMEDA_PULSE_DATA_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload nextest junit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-${{ runner.os }}
          path: target/nextest/**/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload criterion bench artifact (deferred; non-blocking)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-${{ runner.os }}
          path: target/criterion/
          if-no-files-found: ignore
          retention-days: 14

      - name: Download base-branch criterion baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        continue-on-error: true
        with:
          name: criterion-${{ runner.os }}-base
          path: target/criterion-baseline/

      - name: cargo xtask criterion-regression (chunk #56 — mean.point_estimate +10% gate vs base branch)
        run: cargo xtask criterion-regression --current target/criterion --baseline target/criterion-baseline

      - name: Upload capability-drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-drift-${{ runner.os }}
          path: target/capability-drift/report.json
          if-no-files-found: ignore
          retention-days: 14

  # On Linux the supply-chain job's `cargo auditable build --workspace --release`
  # builds the same scope, profile and features.
  release:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # The release job owns its key: a lint-test re-save after a Cargo.lock
      # change drops the release dependencies, which would leave this job cold.
      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: release-${{ runner.os }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo build --workspace --release (macOS + Windows)
        run: cargo build --workspace --release

      - name: cargo build --release -p ingest --example inject_demo (Windows only)
        if: runner.os == 'Windows'
        run: cargo build --release -p ingest --example inject_demo

      # The frame arm of the perf budget, under a software WebGPU adapter set on
      # the app child only. xtask runs by path: `cargo xtask` would rebuild it
      # in debug.
      - name: xtask perf:frame-sample (software WebGPU adapter) (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: ./target/release/xtask.exe perf:frame-sample

      - name: Upload perf-frame logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-perf-frame-${{ runner.os }}
          path: target/perf-frame/
          if-no-files-found: ignore
          retention-days: 14

  mcp-test:
    name: mcp-server tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # The default-features test build's dependencies; only the feature-gated
      # workspace crates compile here.
      - name: Cache cargo (restore only)
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: lint-test-${{ runner.os }}
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: cargo-nextest

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo nextest run --features mcp-server
        run: cargo nextest run --workspace --features mcp-server --profile ci --no-tests=pass

  a11y:
    name: a11y (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Only the xtask binary is compiled here; lint-test owns the key.
      - name: Cache cargo (restore only)
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: lint-test-${{ runner.os }}
          save-if: false

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build --prefix pulse-app/ui (Vite dist for a11y harness)
        working-directory: pulse-app/ui
        run: npm run build

      # A fresh runner has no Playwright browser build for the pinned
      # @playwright/test; the axe/contrast suites launch chromium.
      - name: Install Playwright chromium (a11y harness)
        working-directory: pulse-app/ui
        run: npx playwright install --with-deps chromium

      - name: Download base-branch a11y-violations baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        continue-on-error: true
        with:
          name: a11y-violations-base
          path: pulse-app/ui/tests-a11y/baselines/

      - name: cargo xtask test:a11y (axe + Lighthouse + pa11y + colorjs.io + aggregator + regression)
        run: cargo xtask test:a11y

      - name: Upload a11y violations summary + regression set + contrast report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-violations-${{ runner.os }}
          path: |
            ${{ env.ANDROMEDA_PULSE_DATA_DIR }}/logs/a11y-*.json*
            pulse-app/ui/dist/contrast-report.json
            pulse-app/ui/tests-a11y/regression-set.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright a11y report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-a11y-report-${{ runner.os }}
          path: target/playwright-a11y-report/
          if-no-files-found: ignore
          retention-days: 14

  boot:
    name: boot smoke (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: boot-Linux
          cache-on-failure: true

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo build --features mcp-server (feature-gated binary build smoke)
        run: cargo build --workspace --release --features mcp-server

      - name: Boot pulse-app smoke
        # The runner is headless: without a display tao panics initialising
        # GTK. One xvfb-run spans all three verbs so the X server outlives
        # boot's backgrounded app.
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" bash -c '
            set -e
            bash scripts/agent-run.sh boot
            bash scripts/agent-run.sh status
            bash scripts/agent-run.sh cleanup
          '

      # Reads the log the boot smoke above wrote under ANDROMEDA_PULSE_DATA_DIR.
      - name: cargo xtask ci-gates
        run: cargo xtask ci-gates

      - name: Upload boot logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-boot-${{ runner.os }}
          path: ${{ env.ANDROMEDA_PULSE_DATA_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 14

  supply-chain:
    name: supply-chain (audit + deny + auditable)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # The release dependency graph largely coincides with boot's; boot owns the key.
      - name: Cache cargo (restore only)
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: boot-Linux
          save-if: false

      - name: cargo audit (RustSec advisory DB)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo deny check bans licenses sources
        uses: EmbarkStudios/cargo-deny-action@a4d2d701318fdc1c6ae17ba8cea8f329c5110eb2 # v2.0.17
        with:
          command: check bans licenses sources

      - name: Cranelift-only WASM backend assertion (test-plan §9)
        run: cargo tree -p wasmtime | grep -q "cranelift" || exit 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      # npm advisory + license + ban gate over pulse-app/ui. No npm ci needed:
      # license/class data comes from package-lock.json and `npm audit` reads
      # the lockfile + registry, never node_modules.
      - name: cargo xtask check:npm-supply-chain (npm advisory + license + ban gate)
        run: cargo xtask check:npm-supply-chain

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: Install cargo-auditable
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: cargo-auditable

      # Also the Linux workspace release build smoke.
      - name: cargo auditable build smoke (workspace release)
        run: cargo auditable build --workspace --release

  coverage:
    name: coverage gate (line ≥75% / branch ≥70% / function ≥85%)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Export ANDROMEDA_PULSE_DATA_DIR
        shell: bash
        run: echo "ANDROMEDA_PULSE_DATA_DIR=$RUNNER_TEMP/andromeda-pulse-ci-data" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Registry only: an instrumented target cache would not fit the repo cap.
      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: coverage
          cache-targets: false
          cache-on-failure: true

      - name: Install cargo-nextest + cargo-llvm-cov
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: cargo-nextest,cargo-llvm-cov

      # pulse-app links Tauri's WebKitGTK stack plus dbus (keyring, notify);
      # the build scripts find them through pkg-config.
      - name: Install Linux system libraries (Tauri + dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: npm ci (pulse-app/ui)
        working-directory: pulse-app/ui
        run: npm ci

      - name: npm run build (ui/dist, embedded by tauri::generate_context!)
        working-directory: pulse-app/ui
        run: npm run build

      - name: cargo xtask test:coverage
        run: cargo xtask test:coverage

      - name: Enforce coverage thresholds
        run: |
          set -euo pipefail
          if [ ! -f lcov.info ]; then
            echo "::error::lcov.info missing — coverage gate cannot evaluate"
            exit 1
          fi
          line_total=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' lcov.info)
          line_hit=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' lcov.info)
          branch_total=$(awk -F: '/^BRF:/{s+=$2} END{print s+0}' lcov.info)
          branch_hit=$(awk -F: '/^BRH:/{s+=$2} END{print s+0}' lcov.info)
          fn_total=$(awk -F: '/^FNF:/{s+=$2} END{print s+0}' lcov.info)
          fn_hit=$(awk -F: '/^FNH:/{s+=$2} END{print s+0}' lcov.info)
          if [ "$line_total" -eq 0 ] && [ "$fn_total" -eq 0 ]; then
            echo "Coverage gate: 0 lines / 0 functions tracked (Foundation epoch — gate trivially passes; activates at chunk #15 first tests)"
            exit 0
          fi
          line_pct=$(awk -v h="$line_hit" -v t="$line_total" 'BEGIN { if (t==0) print "100.0"; else printf "%.1f", (h/t)*100 }')
          branch_pct=$(awk -v h="$branch_hit" -v t="$branch_total" 'BEGIN { if (t==0) print "100.0"; else printf "%.1f", (h/t)*100 }')
          fn_pct=$(awk -v h="$fn_hit" -v t="$fn_total" 'BEGIN { if (t==0) print "100.0"; else printf "%.1f", (h/t)*100 }')
          echo "Line:     ${line_hit}/${line_total} = ${line_pct}% (threshold 75%)"
          echo "Branch:   ${branch_hit}/${branch_total} = ${branch_pct}% (threshold 70%)"
          echo "Function: ${fn_hit}/${fn_total} = ${fn_pct}% (threshold 85%)"
          fail=0
          awk -v pct="$line_pct"   'BEGIN { exit (pct + 0 < 75.0) }' || { echo "::error::line coverage ${line_pct}% < 75%"; fail=1; }
          awk -v pct="$branch_pct" 'BEGIN { exit (pct + 0 < 70.0) }' || { echo "::error::branch coverage ${branch_pct}% < 70%"; fail=1; }
          awk -v pct="$fn_pct"     'BEGIN { exit (pct + 0 < 85.0) }' || { echo "::error::function coverage ${fn_pct}% < 85%"; fail=1; }
          [ $fail -eq 0 ]

      - name: Download base-branch coverage baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        continue-on-error: true
        with:
          name: coverage-linux-base
          path: target/lcov-baseline/

      - name: cargo xtask coverage-regression (chunk #55 — line/branch/function gate vs base branch)
        run: cargo xtask coverage-regression --current lcov.info --baseline target/lcov-baseline/lcov.info

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-linux
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 14
