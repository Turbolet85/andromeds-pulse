[workspace]
resolver = "2"
members = [
    "crates/ingest",
    "crates/buffer",
    "crates/viz",
    "crates/ui-bridge",
    "crates/snapshot",
    "crates/curation",
    "crates/triage",
    "crates/corpus",
    "crates/security",
    "crates/workspace-detector",
    "crates/plugins",
    "crates/mcp-server",
    "crates/interpretation",
    "crates/config-watcher",
    "pulse-app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/turbolet85/andromeda-pulse"
authors = ["andromeda-pulse contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
taurpc = "0.7"
specta = { version = "=2.0.0-rc.22", features = ["chrono"] }
specta-typescript = "0.0.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# Ingest pipeline (route#16 — Epoch 2 opens). Pinning rationale:
# - tonic 0.14 + prost 0.14: arch §Stack + §Established Decisions [Backend Framework — OTLP receiver].
# - OTLP wire format via vendored .proto + tonic-build codegen (crates/ingest/proto/ +
#   crates/ingest/build.rs). opentelemetry-proto 0.31 was rejected at /implement time because
#   it has `opentelemetry` + `opentelemetry_sdk` as direct (non-feature-gated) dependencies,
#   contradicting obs-plan §12 user-pivot ("NO OTel SDK in self-observation runtime") +
#   CLAUDE.md universal invariant. Vendored proto path is the strict-spec-compliance fix.
tonic = { version = "0.14", features = ["transport", "router", "server", "codegen"] }
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
prost = "0.14"
tempfile = "3"
rstest = "0.26"
proptest = "1.10"
assert_fs = "1.1"
# Dev-only CommonMark parser for the P-038 structural markdown assert
# (capability spec §P-038 Conductor clause: "verify markdown validates
# against CommonMark parser"). Chunk #100; never enters production builds.
pulldown-cmark = { version = "0.13", default-features = false }

# OTLP HTTP receiver (route#17 — Epoch 2 Ingest pipeline continues).
# axum 0.8 on hyper 1 + tower per arch §Stack + §Established Decisions
# [Backend Framework]. Re-uses the vendored OTLP .proto types from
# crates/ingest/src/grpc.rs::proto::* (no new opentelemetry-proto runtime
# dep — preserves obs criterion #7 strict-grep forbid).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
bytes = "1"
http = "1"
axum-test = "18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Rate-limit middleware for OTLP receivers (route#19 — Epoch 2 Ingest pipeline closes).
# tower_governor 0.8 with axum + tonic features only — `tracing` feature is OFF
# so we emit our own structured events via the .error_handler() callback at the
# `ingest.{grpc|http}.rate_limit.rejected` targets (per obs-plan §6 + AllowList
# discipline in pulse-app/src/observability.rs).
# Per security plan §API Security row 1 + §Dependency Security Pinning.
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tonic"] }

# Storage engine (route#20 — Epoch 3 Storage & query opens).
# DuckDB 1.5.x via `duckdb` crate 1.4.x with `bundled` feature (statically
# links DuckDB C++; cross-platform reproducible Tauri build, no system dep).
# Arrow zero-copy interchange via the `duckdb` crate's `Appender::append_record_batch`
# path — `arrow` crate version pin must match the version `duckdb` re-exports.
# Per arch §Stack and Technologies + §Established Decisions [Database]
# + §Established Decisions [ORM/Migrations] (none — direct SQL via Connection + Appender).
duckdb = { version = "1.10500", features = ["bundled", "appender-arrow"] }
arrow = "58"

# rmcp stdio sidecar (route#48 origin; re-pinned at 2026-08-29-advisory-backlog).
# Bumped 0.6 → 3 to close RUSTSEC-2026-0189 (DNS rebinding, Streamable HTTP
# transport; stated safe upgrade >=1.4.0 — the 3.x line is the current major,
# so the bump does not land on an already-superseded line). This also retires
# the chunk #48 reconciliation note: the old "rmcp 1.5.0 not sourceable, pin
# the 0.x line" caveat (arch §Established Decisions [MCP Server Surface]) is
# obsolete by measurement — the published line reached 3.x.
# `optional = true` per arch §Cross-cutting Patterns "Feature-gate hygiene" —
# rmcp only enters the build graph under `--features mcp-server`. Feature set
# kept minimal: `server` + `transport-io` (both verified present at 3.1.4).
rmcp = { version = "3", features = ["server", "transport-io"] }

# Plugin host runtime (route#45 — Epoch 7 Plugin runtime + MCP server opens).
# wasmtime 25+ with WASM Component Model per arch §Stack and Technologies + §Established
# Decisions [Plugin Runtime]. Cranelift backend stays default on x86_64 (security plan
# §Anti-Patterns Data Protection row 1 — CVE-2026-34941 + CVE-2026-35195 cluster).
# epoch_interruption(true) is required substrate (security plan §API Security row
# "Plugin host capability sandbox"); attaches per-Store ResourceLimiter at chunk #46.
# `wat` dev-dep used in tests to compile WAT text → WASM bytes for fixture Components
# (no committed .wasm binaries this chunk; sidesteps build-time WAT toolchain dep).
# wasmtime 46 pins the patched line per 2026-08-29-advisory-backlog: closes
# RUSTSEC-2026-0222 (stores mix up type indices between engines; stated safe
# upgrade >=46.0.2). The 46 line was chosen over the newer 48 per the same
# precedent that picked 43 at chunk #45 — land the advisory-patched line the
# finding states. Route spec is "wasmtime 25+" (minimum); 46 satisfies it.
# Moved to 48 for RUSTSEC-2026-0316 (dynamic record lifting can allocate
# beyond the hostcall fuel limit; stated safe upgrade >=48.0.3 <49 or
# >=49.0.1 — no patched 46.x). 48 is the nearest patched line.
wasmtime = { version = "48.0.3", features = ["component-model"] }
wat = "1"

# Triage baseline trackers + corpus persistence (route#61 — Epoch 9 Foundation v0.2.0 fifth chunk).
# tdigest: MnO2 streaming t-digest for per-operation p50/p95/p99 percentile baselines;
#   `use_serde` feature gates bincode round-trip via serde derive.
# dashmap: concurrent map for per-service / per-operation state (lock-free reads on hot path);
#   `serde` feature enables corpus serialization.
# bincode 1.x: simple serde-backed binary serialization for corpus state file (per arch
#   §Conventions Validation surface; schema_version field embedded in container struct).
tdigest = { version = "0.2", features = ["use_serde"] }
dashmap = { version = "6", features = ["serde"] }
bincode = "1.3"

# Exception fingerprint hash (route#66 — Epoch 9 Foundation v0.2.0 tenth chunk).
# Deterministic, content-stable, hot-path-fast (~3 GB/s on x86_64). Used by
# crates/buffer/src/fingerprint.rs::compute_exception_fingerprint to hash
# (exception.type + normalized first-3-frame stacktrace) → 16-byte
# ExceptionFingerprint written to span_events.fingerprint BLOB column AND fed
# to triage::pattern::storm::RetryStormDetector via FingerprintObserver trait
# (per arch §Cross-cutting Patterns Module dependency direction: trait in lower
# buffer crate; storm-detector impl in triage receives opaque bytes only,
# no hash recompute). Dual-licensed Apache-2.0/CC0; verified via
# `cargo deny check bans licenses sources`.
blake3 = "1"

# Corpus + security crate substrate (route#68 — Epoch 9 Foundation v0.2.0 final chunk).
# - rusqlite 0.32 with `bundled` feature: statically links SQLite C, no system
#   dep — cross-platform reproducible Tauri build (same posture as duckdb).
# - keyring 3: cross-platform OS-keychain abstraction (macOS Keychain, Linux
#   Secret Service via dbus, Windows Credential Manager). Backends are OPT-IN:
#   keyring 3.x declares NO `default` feature, so a bare `keyring = "3"` links
#   no platform store and silently falls back to a per-process in-memory mock —
#   measured at 2026-08-14-workspace-key-alignment as 13 decryption failures
#   against rows the previous process wrote. The three `*-native` /
#   `sync-secret-service` features are keyring's own per-target optional deps
#   (security-framework / windows-sys / dbus-secret-service), inert off-target.
#   `crypto-rust` gives dbus-secret-service a pure-Rust session cipher —
#   dbus-secret-service ships no default crypto, and the openssl alternative
#   would add a system dep, breaking the reproducibility posture above.
#   Tests use the in-memory FakeKeychainBackend trait impl (per test-plan §6 P5
#   surrogate pattern; no real keychain in CI).
# - aes-gcm 0.10: RustCrypto AES-256-GCM AEAD for per-cell encryption.
#   Default features only — no platform-specific assembly intrinsics
#   (preserves cross-platform reproducibility; performance acceptable for
#   corpus write rates which are bounded by L1/L2 ingest cadence).
# - rand 0.8: nonce generation for AEAD encryption (aes-gcm depends on this).
# - regex 1: PII pattern catalog in crates/security/src/scrubber.rs.
# Per arch §Established Decisions [Database] DELIBERATE SCOPE EXTENSION beyond
# "In-memory DuckDB ring buffer only" — corpus is the FIRST persistent on-disk
# database; chunk #68 plan documents the rationale + flags the security plan
# §Data Protection §At rest schema-level amendment as a wrap-time follow-up.
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
aes-gcm = "0.10"
rand = "0.8"
regex = "1"

# Drain log-template-mining LRU eviction (route#69 — Epoch 9 Foundation v0.2.0 final chunk; Phase B production).
# lru 0.16: standard LRU cache for max_clusters bounded template tree (default 1000 per
# pulse-v0_2_0-route §67). Compile-time-bounded eviction policy mirrors the chunk #66
# DashMap-based RetryStormDetector pattern; both bound memory footprint at fixed cluster cap.
# Used by crates/buffer/src/drain.rs::DrainMiner; algorithm validated at Phase A spike
# (.andromeda/decisions/pre-d2-drain-spike.md PROCEED decision; 167 LOC algo core; 2μs p99
# per-event latency = 25× under <50μs production target).
# Bumped 0.12 → 0.16 to close RUSTSEC-2026-0002 (IterMut violates Stacked Borrows by
# invalidating internal pointer); fix per advisory's "Upgrade to >=0.16.3". Then
# 0.16 → 0.18 at 2026-08-29-advisory-backlog to close RUSTSEC-2026-0253
# (use-after-free in LruCache::pop; stated safe upgrade >=0.18.2). API surface
# used (new(NonZeroUsize), put, get, pop_lru) stable across 0.12 → 0.18.
lru = "0.18"

# Digest assembler tokenizer (route#81 — Epoch 9 Foundation v0.2.0 L3 layer).
# tokenizers (Hugging Face): production-grade BPE/WordPiece/Unigram tokenizer
# library; used by triage::digest::assembler for token-count enforcement
# against the 500-2000 soft / 3000 hard cap budget per dist-arch v3 §L3.
# default-features = false strips the `http` / `progressbar` / `onig` features
# we don't need at this chunk (loading from filesystem only; no HF Hub fetch
# at runtime; no onig regex — uses fancy-regex default split-mode pattern
# which is sufficient for Llama-3 tokenizer.json shape). Tokenizer fixture is
# downloaded at build time via `crates/triage/build.rs` from a pinned
# Xenova/llama-3-tokenizer revision (public, non-gated mirror of Llama-3
# tokenizer.json; future-binds to chunk #82+ LLM runtime choice).
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Build-time HTTPS downloader for tokenizer fixture (route#81).
# ureq 2.x is a minimal blocking HTTP client (no async runtime); used ONLY
# in build.rs scripts to fetch the pinned tokenizer.json + verify SHA-256.
# rustls feature avoids OpenSSL system dep (cross-platform reproducible).
# `tls` feature enables HTTPS support.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

# Configuration hot-reload filesystem watcher (route#96 — Epoch 9 Foundation
# v0.2.0 terminal chunk). `notify` 8.x cross-platform FS watcher (inotify /
# FSEvents / ReadDirectoryChangesW). Consumed by crates/config-watcher to
# observe `<data_dir>/config.toml`; the watched path is canonicalized +
# confined under the data dir before the watcher attaches (CWE-22). Pinned
# per security plan §Dependency Security; passes `cargo deny check bans
# licenses sources`.
notify = "8"

# Every pulse-app integration test is its own binary that statically links
# duckdb + wasmtime + tauri; at full debuginfo each carried a ~0.67 GB PDB and
# one workspace test build reached ~95 GB of target/debug (measured
# 2026-09-29). Line tables keep file:line in our own panic backtraces;
# third-party crates carry no debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
