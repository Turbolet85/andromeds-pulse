[workspace]
resolver = "2"
members = [
    "crates/ingest",
    "crates/buffer",
    "crates/viz",
    "crates/ui-bridge",
    "crates/snapshot",
    "crates/curation",
    "crates/triage",
    "crates/workspace-detector",
    "crates/plugins",
    "crates/mcp-server",
    "pulse-app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/turbolet85/andromeda-pulse"
authors = ["andromeda-pulse contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
taurpc = "0.7"
specta = { version = "=2.0.0-rc.22", features = ["chrono"] }
specta-typescript = "0.0.9"
strict-path = "0.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# Ingest pipeline (route#16 — Epoch 2 opens). Pinning rationale:
# - tonic 0.14 + prost 0.14: arch §Stack + §Established Decisions [Backend Framework — OTLP receiver].
# - OTLP wire format via vendored .proto + tonic-build codegen (crates/ingest/proto/ +
#   crates/ingest/build.rs). opentelemetry-proto 0.31 was rejected at /implement time because
#   it has `opentelemetry` + `opentelemetry_sdk` as direct (non-feature-gated) dependencies,
#   contradicting obs-plan §12 user-pivot ("NO OTel SDK in self-observation runtime") +
#   CLAUDE.md universal invariant. Vendored proto path is the strict-spec-compliance fix.
tonic = { version = "0.14", features = ["transport", "router", "server", "codegen"] }
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
prost = "0.14"
tempfile = "3"
rstest = "0.26"
proptest = "1.10"
assert_fs = "1.1"

# OTLP HTTP receiver (route#17 — Epoch 2 Ingest pipeline continues).
# axum 0.8 on hyper 1 + tower per arch §Stack + §Established Decisions
# [Backend Framework]. Re-uses the vendored OTLP .proto types from
# crates/ingest/src/grpc.rs::proto::* (no new opentelemetry-proto runtime
# dep — preserves obs criterion #7 strict-grep forbid).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
bytes = "1"
http = "1"
axum-test = "18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Rate-limit middleware for OTLP receivers (route#19 — Epoch 2 Ingest pipeline closes).
# tower_governor 0.8 with axum + tonic features only — `tracing` feature is OFF
# so we emit our own structured events via the .error_handler() callback at the
# `ingest.{grpc|http}.rate_limit.rejected` targets (per obs-plan §6 + AllowList
# discipline in pulse-app/src/observability.rs).
# Per security plan §API Security row 1 + §Dependency Security Pinning.
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tonic"] }

# Storage engine (route#20 — Epoch 3 Storage & query opens).
# DuckDB 1.5.x via `duckdb` crate 1.4.x with `bundled` feature (statically
# links DuckDB C++; cross-platform reproducible Tauri build, no system dep).
# Arrow zero-copy interchange via the `duckdb` crate's `Appender::append_record_batch`
# path — `arrow` crate version pin must match the version `duckdb` re-exports.
# Per arch §Stack and Technologies + §Established Decisions [Database]
# + §Established Decisions [ORM/Migrations] (none — direct SQL via Connection + Appender).
duckdb = { version = "1.10500", features = ["bundled", "appender-arrow"] }
arrow = "58"

# rmcp stdio sidecar (route#48 — Epoch 7 Plugin runtime + MCP server continues).
# Per arch §Established Decisions [MCP Server Surface] + §Inherited Defaults
# "API style — external MCP" Open Question reconciliation: input-cited
# "rmcp 1.5.0" not sourceable on crates.io (likely confused with MCP spec
# version 2024-11-05 / 1.5.0 protocol), so chunk #48 pins the latest published
# 0.x line (`0.6`). `optional = true` per arch §Cross-cutting Patterns
# "Feature-gate hygiene" — rmcp only enters the build graph under
# `--features mcp-server`. Feature set kept minimal: `server` (the
# ServerHandler-side traits) + `transport-io` (stdio transport).
rmcp = { version = "0.6", features = ["server", "transport-io"] }

# Plugin host runtime (route#45 — Epoch 7 Plugin runtime + MCP server opens).
# wasmtime 25+ with WASM Component Model per arch §Stack and Technologies + §Established
# Decisions [Plugin Runtime]. Cranelift backend stays default on x86_64 (security plan
# §Anti-Patterns Data Protection row 1 — CVE-2026-34941 + CVE-2026-35195 cluster).
# epoch_interruption(true) is required substrate (security plan §API Security row
# "Plugin host capability sandbox"); attaches per-Store ResourceLimiter at chunk #46.
# `wat` dev-dep used in tests to compile WAT text → WASM bytes for fixture Components
# (no committed .wasm binaries this chunk; sidesteps build-time WAT toolchain dep).
# wasmtime 43+ pins the patched line per cargo audit at chunk #45 implementation
# (wasmtime 25.0.x line is unmaintained — RUSTSEC-2025-0046 / -0118 + RUSTSEC-2026-0020/-0021/-0085..-0096
# all unpatched on 25.x; solutions specify >=24.0.7 OR >=36.0.7 OR >=42.0.2 OR >=43.0.1).
# Route spec is "wasmtime 25+" (minimum); 43+ satisfies and brings full patch coverage.
wasmtime = { version = "43", features = ["component-model"] }
wat = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
