[package]
name = "pulse-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pulse-app"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tracing-error.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-updater.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-notification.workspace = true
taurpc.workspace = true
bytes.workspace = true
strict-path.workspace = true
duckdb.workspace = true
wasmtime.workspace = true
ui-bridge = { path = "../crates/ui-bridge" }
ingest = { path = "../crates/ingest" }
buffer = { path = "../crates/buffer" }
viz = { path = "../crates/viz" }
plugins = { path = "../crates/plugins" }
snapshot = { path = "../crates/snapshot" }
workspace-detector = { path = "../crates/workspace-detector" }

[dependencies.mcp-server-crate]
package = "mcp-server"
version = "0.1.0"
path = "../crates/mcp-server"
optional = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
wat.workspace = true

[features]
default = []
mcp-server = ["dep:mcp-server-crate"]
otap-ingest = []
