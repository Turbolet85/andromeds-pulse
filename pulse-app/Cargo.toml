[package]
name = "pulse-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pulse-app"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tracing-error.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tauri.workspace = true
tauri-plugin-updater.workspace = true
taurpc.workspace = true
bytes.workspace = true
strict-path.workspace = true
duckdb.workspace = true
ui-bridge = { path = "../crates/ui-bridge" }
ingest = { path = "../crates/ingest" }
buffer = { path = "../crates/buffer" }
viz = { path = "../crates/viz" }
plugins = { path = "../crates/plugins" }

[dependencies.mcp-server-crate]
package = "mcp-server"
version = "0.1.0"
path = "../crates/mcp-server"
optional = true

[build-dependencies]
tauri-build.workspace = true

[features]
default = []
mcp-server = ["dep:mcp-server-crate"]
otap-ingest = []
