[package]
name = "buffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-error.workspace = true
duckdb.workspace = true
arrow.workspace = true
bytes.workspace = true
# Chunk #66 — exception fingerprint hashing (see Cargo.toml workspace dep block).
blake3.workspace = true
# Chunk #69 Phase B — Drain log-template-mining substrate.
# regex: regex-config-driven masker (NUM / IP / HEX / PATH categories) BEFORE tokenization.
# bincode + serde: template tree serialization for corpus persistence round-trip.
# lru: max_clusters bounded eviction (default 1000 per pulse-v0_2_0-route §67).
regex.workspace = true
bincode.workspace = true
serde.workspace = true
lru.workspace = true

# Sanctioned sibling-DAG edge: the `Batch` enum is the cross-crate hand-off
# contract from ingest → buffer (per arch §Established Decisions
# [In-Process Channel Architecture] + §Module dependency direction).
ingest = { path = "../ingest" }

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
# `test-util` enables `tokio::time::pause()` + `tokio::time::advance(...)` for
# deterministic retention-window tests (chunk #21). Production `tokio.workspace`
# above keeps the `["full"]` feature set; only test builds gain `test-util`
# (per testing rule Session Addition 2026-05-03).
tokio = { workspace = true, features = ["test-util"] }
