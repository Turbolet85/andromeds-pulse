[package]
name = "buffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-error.workspace = true
duckdb.workspace = true
arrow.workspace = true
bytes.workspace = true
# Chunk #66 — exception fingerprint hashing (see Cargo.toml workspace dep block).
blake3.workspace = true
# Chunk #69 Phase B — Drain log-template-mining substrate.
# regex: regex-config-driven masker (NUM / IP / HEX / PATH categories) BEFORE tokenization.
# bincode + serde: template tree serialization for corpus persistence round-trip.
# lru: max_clusters bounded eviction (default 1000 per pulse-v0_2_0-route §67).
regex.workspace = true
bincode.workspace = true
serde.workspace = true
lru.workspace = true

# Sanctioned sibling-DAG edge: the `Batch` enum is the cross-crate hand-off
# contract from ingest → buffer (per arch §Established Decisions
# [In-Process Channel Architecture] + §Module dependency direction).
ingest = { path = "../ingest" }

# Chunk #69 Phase B Session 7+ — Drain template content MUST pass through the
# PII scrubber BEFORE the DuckDB `log_templates` write (capability P-047 +
# security plan §Logging NEVER-log discipline extended to a new persistence
# surface). Sanctioned sibling-DAG edge mirroring the `corpus → security` dep
# (chunk #68) — preserves arch §Module dependency direction (no library crate
# depends on a sibling unless its declared contract requires it; PII scrub
# IS that contract for the `log_templates` write path).
security = { path = "../security" }

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
# `test-util` enables `tokio::time::pause()` + `tokio::time::advance(...)` for
# deterministic retention-window tests (chunk #21). Production `tokio.workspace`
# above keeps the `["full"]` feature set; only test builds gain `test-util`
# (per testing rule Session Addition 2026-05-03).
tokio = { workspace = true, features = ["test-util"] }
# Chunk #77 — Drain LogHub-style golden corpus regression harness reads
# expected.json fixtures via serde_json (test-only; no production link).
serde_json.workspace = true
