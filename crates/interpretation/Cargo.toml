[package]
name = "interpretation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# L4 LLM interpretation layer (route#82 — Epoch 9 Foundation v0.2.0 first L4 chunk).
# Per arch §Established Decisions [LLM Inference Runtime — L4 interpretation layer]
# bus factor mitigation entry: this crate exposes the `LlmInferenceRunner` trait +
# `HardwareProfileDetector` + supporting contract types. NO direct `mistralrs`
# dep at this crate level — that's the binary boundary (`pulse-app/`) per arch
# §Module dependency direction. Trait abstraction lets future swap to candle
# (or other runtime) without workspace-wide rewrite.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# Re-export hardware profile substrate from triage (chunk #80 introduced the
# `HardwareProfile` enum + `HardwareProfileSource` trait + `UnknownHardwareProfile`
# default at `crates/triage/src/cadence/coordinator.rs`; re-exported via
# `triage::contract::*`). interpretation::hardware provides the REAL detector
# implementing the existing trait.
triage = { path = "../triage" }

# Chunk #94 — `markdown::assemble_report` moved here from pulse-app so the MCP
# `retrieve_report` tool and the `incidents.get_report` resolver share one
# Incident → Report projection (P-038 single-source). The projection applies
# defense-in-depth scrubbing, so the PII scrubber primitive is now a direct
# dep (security is a leaf crate — no cycle).
security = { path = "../security" }

[dev-dependencies]
rstest = { workspace = true }
tempfile.workspace = true
# `test-util` enables `tokio::time::pause()` + `tokio::time::advance(...)` for
# the chunk #86 degraded-mode backoff progression tests (FAILURE_WINDOW_SECS 5min
# + BACKOFF_PROGRESSION_SECS [2/5/10 min]). Workspace `features = ["full"]` does NOT
# include test-util per CLAUDE.md testing.md 2026-05-03 session-learning; opting in
# per-crate keeps production tokio surface unchanged.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# Exposes test-only constructors (`HardwareProfileDetector::with_profile`)
# to integration tests in sibling crates. Enabled by `pulse-app/tests/`
# when needed; not part of the default build surface.
test-utils = []
