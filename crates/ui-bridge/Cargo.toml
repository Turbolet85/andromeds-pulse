[package]
name = "ui-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["taurpc-runtime"]
taurpc-runtime = ["dep:taurpc", "dep:tauri", "dep:specta", "dep:tokio"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
chrono.workspace = true
tracing.workspace = true
ingest = { path = "../ingest" }
buffer = { path = "../buffer" }
viz = { path = "../viz" }
snapshot = { path = "../snapshot" }
plugins = { path = "../plugins" }
workspace-detector = { path = "../workspace-detector" }
mcp-server = { path = "../mcp-server" }

# Tauri / TauRPC runtime — gated so xtask + downstream type consumers can opt out.
taurpc = { workspace = true, optional = true }
tauri = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
rstest.workspace = true
