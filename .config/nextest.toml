[profile.default]
# Chunk #99: the four-profile load suite (dist-arch v3 §Load testing) runs
# ~12 minutes at full duration — excluded from every default/ci/coverage run
# via default-filter; re-selected only by `[profile.load-profiles]` below
# (invoked through `cargo xtask perf:load-profiles` as the release gate).
# No `#[ignore]` gating (quarantine-tracking-check requires issue URLs) and
# no new env var (arch §Occupied Resources frozen for chunk #99).
default-filter = "not binary(perf_load_profiles)"

[profile.ci]
# Zero-flake gate per test-plan §10: first flake triggers `#[ignore]`
# quarantine + root-cause investigation, NOT auto-retry.
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
final-status-level = "all"

[profile.load-profiles]
# Chunk #99 release-gate profile: selects ONLY the four-profile load suite.
# Zero-flake posture preserved (retries = 0); slow-timeout sized for the
# 5-minute high/sustained profiles (120s period x 10 = 20min terminate cap:
# sustained = 300s injection + up to 420s maintenance-tolerant drain + rig
# teardown — the prior x5/10min cap killed a passing-shaped run at 600.1s).
# SERIAL execution (test-threads = 1): each profile is a distinct dist-arch
# scenario and must own the host — first run proved that the high +
# sustained profiles co-running inflate L1a p99 (1366ms vs 174ms-class solo)
# and starve the drain window via cross-test CPU contention.
default-filter = "binary(perf_load_profiles)"
test-threads = 1
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 10 }
final-status-level = "all"
